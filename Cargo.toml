[package]
authors = ["Juliette Cordor", "Patrick Auernig <dev.patrick.auernig@gmail.com>"]
description = "A Rust client for Discord RPC."
edition = "2021"
keywords = ["discord", "ipc", "rpc"]
license = "MIT"
name = "discord-presence"
readme = "README.md"
repository = "https://github.com/jewlexx/discord-presence.git"
rust-version = "1.70.0"
version = "2.1.0"

[features]
unstable_name = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
byteorder = "1.5"
bytes = "1.6"
cfg-if = "1.0"
crossbeam-channel = "0.5"
log = "0.4"
num-derive = "0.4"
num-traits = "0.2"
parking_lot = "0.12"
paste = "1.0"
quork = { version = "0.7", default-features = false, features = [
    "macros",
    "traits",
] }
serde_json = "1.0"
thiserror = "2.0"

[dependencies.serde]
features = ["derive"]
version = "1.0"

[dependencies.uuid]
features = ["v4"]
version = "1.17"

[dev-dependencies]
anyhow = "1.0"
ctrlc = "3.4"
tracing-subscriber = "0.3"
version-sync = "0.9"

[[example]]
name = "blocking_vencord"
path = "examples/blocking_vencord.rs"
required-features = ["unstable_name"]
